<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>気温クイズ</title>
<link rel="stylesheet" href="quiz.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body onload="getLocation()">

  <header>

<h1>🌤️ 気温クイズ</h1>

<a href="index.html">戻る</a>

  </header>

<main class="container">
<section class="weather-panel">
  <div class="location-box">
    <h2>📍 現在地</h2>
    <p id="location">場所を取得しています...</p>
    <p id="currentWeather">天気を取得しています...</p>
<div class="records"><div><span>🔥 観測史上の最高</span><strong id="recordHigh">--</strong></div><div><span>❄️ 観測史上の最低</span><strong id="recordLow">--</strong></div></div>
  </div>
  <div class="quiz-box">
    <h2>🌡️ 気温を予想しよう！</h2>
    <p class="quiz-question">今のこの場所の気温は何℃でしょう？</p>
    <div class="answer-area">
      <input id="answer" type="number" step="0.1" placeholder="気温を入力">
      <span>℃</span>
      <button onclick="checkAnswer()">答える</button>
    </div>
    <p id="result"></p>
    <button class="detail-button" onclick="toggleDetails()">👀 見る</button>
    <div id="details" class="details hidden">
      <h3>現在の詳しい天気</h3>
      <div class="detail-grid">
        <div><span>🌡️ 気温</span><strong id="temperature">--</strong></div>
        <div><span>💧 湿度</span><strong id="humidity">--</strong></div>
        <div><span>💨 風速</span><strong id="windSpeed">--</strong></div>
        <div><span>🧭 風向き</span><strong id="windDirection">--</strong></div>
      </div>
    </div>
  </div>
</section>
<section class="map-panel">
  <h2>🗺️ 地図</h2>
  <p>場所をクリックすると、その場所でクイズできます。</p>
  <div id="map"></div>
</section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="quiz.js"></script>
</body>

</html>
